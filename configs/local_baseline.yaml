experiment_name: MSL NavCam weighted U-Net baseline
runtime: {accelerator: auto, run_id: msl_navcam_local_baseline}
data: {dataset_manifest: ai4mars_dataset_manifest.csv, train_manifest: splits/msl_navcam_v1/train_nav.csv, val_manifest: splits/msl_navcam_v1/val_nav.csv, label_scheme: NAV}
model: {encoder: resnet34, pretrained_encoder: imagenet}
training: {seed: 42, image_size: 256, batch_size: 4, epochs: 20, learning_rate: 0.001, class_weights: [1.0, 1.0, 1.0, 1.0], num_workers: 0, pin_memory: true, mixed_precision: false, checkpoint_interval: 1}
logging: {batch_log_interval: 100}